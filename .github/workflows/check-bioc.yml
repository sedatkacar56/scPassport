on:
  push:
    branches: [devel]
    paths-ignore:
      - 'paper.md'
      - 'paper.bib'
      - 'paper_figures/**'
      - '.github/workflows/draft-pdf.yml'
  pull_request:
    branches: [devel]

name: R-CMD-check-bioc

jobs:
  build-check:
    name: Check on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'
          use-public-rspm: true

      - name: Install system dependencies
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev pandoc

      - name: Install all R dependencies
        run: |
          install.packages(c("rcmdcheck", "BiocManager", "rmarkdown", "knitr", "testthat"), repos = "https://cloud.r-project.org")
          BiocManager::install(version = "devel", ask = FALSE, update = FALSE)
          BiocManager::install(c(
            "shiny", "miniUI", "Rcpp", "S4Vectors",
            "SummarizedExperiment", "SingleCellExperiment",
            "BiocCheck"
          ), ask = FALSE)
        shell: Rscript {0}

      - name: R CMD check
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          rcmdcheck::rcmdcheck(".", args = "--no-manual", error_on = "warning")
        shell: Rscript {0}

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(".", `quit-with-status` = FALSE, `new-package` = TRUE)
        shell: Rscript {0}
