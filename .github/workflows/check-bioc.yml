on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]

name: R-CMD-check-bioc

jobs:
  build-check:
    name: Check on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2.11.3
        with:
          r-version: 'devel'
          use-public-rspm: true

      - name: Install BiocManager
        run: |
          install.packages("BiocManager")
          BiocManager::install(version = "devel", ask = FALSE)
        shell: Rscript {0}

      - name: Install rcmdcheck
        run: install.packages("rcmdcheck")
        shell: Rscript {0}

      - name: Install dependencies
        run: |
          BiocManager::install(c(
            "shiny", "miniUI", "Rcpp", "S4Vectors",
            "SummarizedExperiment", "SingleCellExperiment",
            "BiocCheck"
          ), ask = FALSE)
        shell: Rscript {0}

      - name: R CMD check
        run: |
          rcmdcheck::rcmdcheck(".", args = "--no-manual", error_on = "warning")
        shell: Rscript {0}

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(".", `quit-with-status` = FALSE, `new-package` = TRUE)
        shell: Rscript {0}
